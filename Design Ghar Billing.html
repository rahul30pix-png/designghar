function enter(){try{sessionStorage.setItem('dg_s','1')}catch(e){}$('nav').style.display='';$('#lo').style.display='';S={v:'dash',q:'',f:'',a:'',b:''};render()}
function logout(){try{sessionStorage.removeItem('dg_s');localStorage.removeItem('dg_keep');sessionStorage.removeItem('dg_c')}catch(e){}authUI('login')}
function authUI(m){$('nav').style.display='none';$('#lo').style.display='none';closeM();const a=ab();m=m||(a?'login':'signup');
 const H={signup:['Create account',F('a_n','Shop / your name')+F('a_e','Email (Gmail)','','email')+F('a_p','Password (min 6 characters)','','password')+F('a_c','Confirm password','','password'),'doSignup','Create account'],
 login:['Login',F('a_e','Email','','email')+F('a_p','Password','','password')+'<label><input type="checkbox" id="a_k" style="width:auto;min-height:0"> Stay signed in on this device</label>','doLogin','Login'],
 forgot:['Reset password',F('a_e','Account email','','email')+F('a_r','Recovery code')+F('a_p','New password (min 6 characters)','','password')+F('a_c','Confirm new password','','password'),'doForgot','Reset password'],cust:['Customer login',F('a_e','Customer ID')+F('a_p','Password','','password'),'doCust','Login']}[m];
 const tabs=['login','signup'].includes(m)?`<div class="bar" role="tablist" style="margin-bottom:14px"><button class="${m=='login'?'btn':'b2'}" style="flex:1;margin:0" aria-selected="${m=='login'}" onclick="authUI('login')">Login</button><button class="${m=='signup'?'btn':'b2'}" style="flex:1;margin:0" aria-selected="${m=='signup'}" onclick="authUI('signup')">Create Account</button></div>`:'';
 $('#main').innerHTML=`<div class="mo auth"><img src="${LOGO}" alt="Design Ghar" style="display:block;height:120px;margin:0 auto 10px"><p class="tag">PRINT FOR CREATIVES, BY CREATIVES</p>${tabs}<h2 style="text-align:center">${H[0]}</h2>${H[1]}<p id="err" role="alert"></p><button class="btn" style="width:100%" onclick="${H[2]}(this)">${H[3]}</button><p style="text-align:center">${m=='login'?`<a href="#" style="color:var(--ot)" onclick="authUI('cust');return false">Customer login</a> · `+`<a href="#" style="color:var(--ot)" onclick="authUI('forgot');return false">Forgot password?</a>`:(m=='cust'||m=='forgot')?`<a href="#" style="color:var(--ot)" onclick="authUI('login');return false">Back to login</a>`:a?`<a href="#" style="color:var(--ot)" onclick="authUI('login');return false">Back to login</a>`:''}</p></div>`}
document.addEventListener('keydown',e=>{const a=e.key=='Enter'&&e.target.closest&&e.target.closest('.auth');if(a)a.querySelector('.btn').click()});
function gmail(to,su,body){window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(su)+'&body='+encodeURIComponent(body),'_blank')}
function showCode(rc,e){openM('Save your recovery code',`<p>If you forget your password, this code is the only way to reset it. Save it now.</p><h2 style="letter-spacing:2px;color:var(--ot)">${rc}</h2><div class="acts"><button class="b2" onclick="try{navigator.clipboard.writeText('${rc}');toast('Copied')}catch(e){}">Copy</button><button class="b2" onclick="gmail('${esc(e)}','DESIGN GHAR recovery code','Recovery code: ${rc}')">Send to my Gmail</button></div><label><input type="checkbox" id="sd" style="width:auto;min-height:0"> I have saved it</label><button class="btn" onclick="$('#sd').checked?(closeM(),enter()):toast('Tick the box after saving the code')">Continue</button>`)}
async function doSignup(b){const n=$('#a_n').value.trim(),e=$('#a_e').value.trim().toLowerCase(),p=$('#a_p').value;if(!n)return er('Name is required');if(!/^\S+@\S+\.\S+$/.test(e))return er('Enter a valid email');if(p.length<6)return er('Password must be at least 6 characters');if(p!==$('#a_c').value)return er('Passwords do not match');
 b.disabled=true;b.textContent='Creating…';const salt=mkSalt(),rc=mkCode();if(!lsSet({name:n,email:e,salt,hash:await hx(p,salt),rc:await hx(rc,salt),createdAt:new Date().toISOString()})){b.disabled=false;b.textContent='Create account';return}showCode(rc,e)}
async function doLogin(b){const a=ab(),e=$('#a_e').value.trim().toLowerCase();if(wait())return er('Too many attempts. Wait '+wait()+' seconds');b.disabled=true;const ok=a&&e==a.email&&await hx($('#a_p').value,a.salt)==a.hash;b.disabled=false;if(!ok){bad();return er('Wrong email or password')}
 fails=0;try{$('#a_k').checked?localStorage.setItem('dg_keep','1'):localStorage.removeItem('dg_keep')}catch(x){}enter()}
async function doForgot(b){const a=ab(),e=$('#a_e').value.trim().toLowerCase(),p=$('#a_p').value;if(wait())return er('Too many attempts. Wait '+wait()+' seconds');if(p.length<6)return er('Password must be at least 6 characters');if(p!==$('#a_c').value)return er('Passwords do not match');
 b.disabled=true;const ok=a&&e==a.email&&await hx($('#a_r').value.trim().toUpperCase(),a.salt)==a.rc;if(!ok){b.disabled=false;bad();return er('Email or recovery code is incorrect')}const rc=mkCode();if(lsSet({...a,hash:await hx(p,a.salt),rc:await hx(rc,a.salt)}))showCode(rc,e);else b.disabled=false}
async function chgPw(rc){const a=ab();if(await hx($('#c_o').value,a.salt)!=a.hash)return toast('Current password is wrong');if(rc){const c=mkCode();if(lsSet({...a,rc:await hx(c,a.salt)}))showCode(c,a.email);return}const n=$('#c_n').value;if(n.length<6)return toast('New password must be at least 6 characters');if(lsSet({...a,hash:await hx(n,a.salt)}))toast('Password changed')}
function gmailBackup(){const a=ab()||{},t='DESIGN GHAR backup '+today()+'\n\n'+JSON.stringify(db);try{navigator.clipboard.writeText(t)}catch(e){}db.settings.lastBackup=Date.now();save('settings');gmail(BK,'DESIGN GHAR backup '+today(),'Backup is copied to your clipboard. Long-press here and Paste, then Send.');toast('Backup copied. Paste it in the email and send.')}
load();applyTheme();cs()&&!unlocked()?portal():ab()&&unlocked()?enter():authUI();
